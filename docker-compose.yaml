services:
  ocf-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: iot-gateway-rpi
    hostname: rpi-gateway
    networks:
      iot-network:
        ipv4_address: 172.20.0.10  
    ports:
      - "5000:5000"      
      - "5683:5683/udp"  # OCF CoAP
    volumes:
      - sensor-state:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/sensors"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    tty: true
    stdin_open: true
    environment:
      - PYTHONUNBUFFERED=1

  ocf-client-1:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: iot-client-laptop
    hostname: client-laptop
    networks:
      iot-network:
        ipv4_address: 172.20.0.20
    depends_on:
      ocf-server:
        condition: service_healthy  # ← Đợi server ready
    restart: unless-stopped
    tty: true
    stdin_open: true

  ocf-client-2:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: iot-client-mobile
    hostname: client-mobile
    networks:
      iot-network:
        ipv4_address: 172.20.0.21
    depends_on:
      ocf-server:
        condition: service_healthy  # ← Đợi server ready
    restart: unless-stopped
    tty: true
    stdin_open: true

networks:
  iot-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"  # Inter-container communication
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  sensor-state: